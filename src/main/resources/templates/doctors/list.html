<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Doctors')}"></head>
<body>
<header th:replace="~{layout/fragments :: header}"></header>
<main id="main-content" class="container py-5">
    <div th:replace="~{layout/fragments :: alerts}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><h1 class="h2 mb-1">Doctor directory</h1><p class="text-secondary mb-0">Find doctors by specialization and availability.</p></div>
        <a class="btn btn-primary" th:href="@{/doctors/new}">Register doctor</a>
    </div>
    <form method="get" th:action="@{/doctors}" class="row g-3 align-items-end bg-white border rounded-4 p-3 mb-4" role="search">
        <div class="col-lg-4">
            <label class="form-label" for="keyword">Search doctors</label>
            <input class="form-control" type="search" id="keyword" name="keyword" th:value="${keyword}" placeholder="Name, code, phone, or email">
        </div>
        <div class="col-sm-6 col-lg-3">
            <label class="form-label" for="specialization">Specialization</label>
            <select class="form-select" id="specialization" name="specialization">
                <option value="">All specializations</option>
                <option th:each="option : ${specializations}" th:value="${option}" th:selected="${option == specialization}" th:text="${option}"></option>
            </select>
        </div>
        <div class="col-sm-6 col-lg-2">
            <label class="form-label" for="available">Availability</label>
            <select class="form-select" id="available" name="available">
                <option value="">All doctors</option>
                <option value="true" th:selected="${available == true}">Available</option>
                <option value="false" th:selected="${available == false}">Unavailable</option>
            </select>
        </div>
        <div class="col-lg-3 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Search</button>
            <a class="btn btn-outline-secondary" th:href="@{/doctors}">Clear</a>
        </div>
    </form>
    <p class="text-secondary small" th:text="|${records.totalElements} doctor(s) found|"></p>
    <div th:if="${records.empty}"><div th:replace="~{layout/fragments :: emptyState('person-badge', 'No doctors found', 'Try another search, clear your filters, or register a doctor.', 'Register doctor', @{/doctors/new})}"></div></div>
    <div th:unless="${records.empty}" class="card border-0 shadow-sm overflow-hidden">
        <p class="table-scroll-hint d-lg-none">Swipe or scroll horizontally to see all columns.</p><div class="table-responsive" tabindex="0" role="region" aria-label="Doctor results — scroll horizontally to see all columns">
            <table class="table align-middle mb-0 directory-table">
                <caption class="visually-hidden">Doctor search results</caption>
                <thead><tr><th scope="col">Code</th><th scope="col">Name</th><th scope="col">Specialization</th><th scope="col">Fee</th><th scope="col">Availability</th><th scope="col">Actions</th></tr></thead>
                <tbody>
                    <tr th:each="record : ${records}">
                        <td class="text-nowrap small" th:text="${record.doctorCode}"></td>
                        <td><a class="fw-semibold" th:href="@{/doctors/{id}(id=${record.id})}" th:text="${record.fullName}"></a></td>
                            <td th:text="${record.specialization}"></td>
                            <td th:text="${#numbers.formatDecimal(record.consultationFee, 1, 2)}"></td>
                            <td><span class="badge" th:classappend="${record.available ? 'text-bg-success' : 'text-bg-secondary'}" th:text="${record.available ? 'Available' : 'Unavailable'}"></span></td>
                        <td class="text-nowrap">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/doctors/{id}/edit(id=${record.id})}" th:attr="aria-label=|Edit ${record.fullName}|">Edit</a>
                            <a data-confirm class="btn btn-sm btn-outline-danger" th:href="@{/doctors/{id}/delete(id=${record.id})}" th:attr="aria-label=|Delete ${record.fullName}|">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <nav th:if="${records.totalPages > 0}" class="d-flex flex-wrap align-items-center justify-content-between gap-3 mt-4" aria-label="Doctor directory pages">
        <span class="text-secondary small" th:text="|Page ${records.number + 1} of ${records.totalPages}|"></span>
        <div class="d-flex gap-2">
            <a th:if="${records.hasPrevious()}" class="btn btn-outline-secondary" th:href="@{/doctors(keyword=${keyword},specialization=${specialization},available=${available},page=${records.number - 1})}">Previous</a>
            <a th:if="${records.hasNext()}" class="btn btn-outline-secondary" th:href="@{/doctors(keyword=${keyword},specialization=${specialization},available=${available},page=${records.number + 1})}">Next</a>
        </div>
    </nav>
</main>
<footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
