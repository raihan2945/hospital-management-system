<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Appointments')}"></head>
<body>
<header th:replace="~{layout/fragments :: header}"></header>
<main id="main-content" class="container py-5">
    <div th:replace="~{layout/fragments :: alerts}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><h1 class="h2 mb-1">Appointments</h1><p class="text-secondary mb-0">Schedule visits and follow each appointment through to completion.</p></div>
        <a class="btn btn-primary" th:href="@{/appointments/new}">Schedule appointment</a>
    </div>
    <form method="get" th:action="@{/appointments}" class="row g-3 align-items-end bg-white border rounded-4 p-3 mb-4" aria-label="Filter appointments">
        <div class="col-sm-6 col-lg-2">
            <label class="form-label" for="date">Date</label>
            <input class="form-control" type="date" id="date" name="date" th:value="${date}">
        </div>
        <div class="col-sm-6 col-lg-3">
            <label class="form-label" for="patientId">Patient</label>
            <select class="form-select" id="patientId" name="patientId">
                <option value="">All patients</option>
                <option th:each="patient : ${patients}" th:value="${patient.id}" th:selected="${patient.id == patientId}" th:text="|${patient.fullName} (${patient.patientCode})|"></option>
            </select>
        </div>
        <div class="col-sm-6 col-lg-3">
            <label class="form-label" for="doctorId">Doctor</label>
            <select class="form-select" id="doctorId" name="doctorId">
                <option value="">All doctors</option>
                <option th:each="doctor : ${doctors}" th:value="${doctor.id}" th:selected="${doctor.id == doctorId}" th:text="|${doctor.fullName} (${doctor.doctorCode})|"></option>
            </select>
        </div>
        <div class="col-sm-6 col-lg-2">
            <label class="form-label" for="status">Status</label>
            <select class="form-select" id="status" name="status">
                <option value="">All statuses</option>
                <option th:each="option : ${statuses}" th:value="${option}" th:selected="${option == status}" th:text="${#strings.capitalize(#strings.toLowerCase(option.name()))}"></option>
            </select>
        </div>
        <div class="col-lg-2 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Filter</button>
            <a class="btn btn-outline-secondary" th:href="@{/appointments}">Clear</a>
        </div>
    </form>
    <p class="text-secondary small" th:text="|${records.totalElements} appointment(s) found|"></p>
    <div th:if="${records.empty}"><div th:replace="~{layout/fragments :: emptyState('calendar2-week', 'No appointments found', 'Try different filters or schedule a new appointment.', 'Schedule appointment', @{/appointments/new})}"></div></div>
    <div th:unless="${records.empty}" class="card border-0 shadow-sm overflow-hidden">
        <p class="table-scroll-hint d-lg-none">Swipe or scroll horizontally to see all columns.</p><div class="table-responsive" tabindex="0" role="region" aria-label="Appointment results — scroll horizontally to see all columns">
            <table class="table align-middle mb-0 directory-table">
                <caption class="visually-hidden">Appointments matching the selected filters</caption>
                <thead><tr><th scope="col">Code</th><th scope="col">Date / time</th><th scope="col">Patient</th><th scope="col">Doctor</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead>
                <tbody>
                    <tr th:each="record : ${records}">
                        <td class="small text-nowrap" th:text="${record.appointmentCode}"></td>
                        <td class="text-nowrap"><span th:text="${record.appointmentDate}"></span><br><span class="text-secondary small" th:text="${#temporals.format(record.appointmentTime, 'HH:mm')}"></span></td>
                        <td><a th:href="@{/patients/{id}(id=${record.patient.id})}" th:text="${record.patient.fullName}"></a></td>
                        <td><a th:href="@{/doctors/{id}(id=${record.doctor.id})}" th:text="${record.doctor.fullName}"></a></td>
                        <td><span th:replace="~{appointments/fragments :: status(${record.status})}"></span></td>
                        <td class="text-nowrap">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/appointments/{id}(id=${record.id})}">View</a>
                            <a th:if="${record.editable and !billedAppointmentIds.contains(record.id)}" class="btn btn-sm btn-outline-primary" th:href="@{/appointments/{id}/edit(id=${record.id})}">Edit</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <nav th:if="${records.totalPages > 0}" class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-4" aria-label="Appointment pages">
        <span class="text-secondary small" th:text="|Page ${records.number + 1} of ${records.totalPages}|"></span>
        <div class="d-flex gap-2">
            <a th:if="${records.hasPrevious()}" class="btn btn-outline-secondary" th:href="@{/appointments(date=${date},patientId=${patientId},doctorId=${doctorId},status=${status},page=${records.number - 1})}">Previous</a>
            <a th:if="${records.hasNext()}" class="btn btn-outline-secondary" th:href="@{/appointments(date=${date},patientId=${patientId},doctorId=${doctorId},status=${status},page=${records.number + 1})}">Next</a>
        </div>
    </nav>
</main>
<footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
