<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(${title})}"></head>
<body>
<header th:replace="~{layout/fragments :: header}"></header>
<main id="main-content" class="container py-5">
    <section class="form-page mx-auto card border-0 shadow-sm p-5">
        <p th:if="${statusCode != null}" class="small fw-semibold text-secondary" th:text="|Error ${statusCode}|"></p>
        <h1 class="h3" th:text="${title}"></h1>
        <p class="text-secondary my-3" th:text="${message}"></p>
        <p th:if="${reference != null}" class="small text-secondary">If this continues, give support this reference: <span th:text="${reference}"></span>.</p>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-primary" th:href="@{/dashboard}">Dashboard</a>
            <a class="btn btn-outline-primary" th:href="@{/billing}">Billing</a>
            <a class="btn btn-primary" th:href="@{/appointments}">Appointments</a>
            <a class="btn btn-primary" th:href="@{/patients}">Patient directory</a>
            <a class="btn btn-outline-secondary" th:href="@{/doctors}">Doctor directory</a>
        </div>
    </section>
</main>
<footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
