<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Patients')}"></head>
<body>
<header th:replace="~{layout/fragments :: header}"></header>
<main id="main-content" class="container py-5">
    <div th:replace="~{layout/fragments :: alerts}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><h1 class="h2 mb-1">Patient directory</h1><p class="text-secondary mb-0">Find patients and keep their registration details up to date.</p></div>
        <a class="btn btn-primary" th:href="@{/patients/new}">Register patient</a>
    </div>
    <form method="get" th:action="@{/patients}" class="row g-3 align-items-end bg-white border rounded-4 p-3 mb-4" role="search">
        <div class="col-lg-4">
            <label class="form-label" for="keyword">Search patients</label>
            <input class="form-control" type="search" id="keyword" name="keyword" th:value="${keyword}" placeholder="Name, code, phone, or email">
        </div>
        <div class="col-sm-6 col-lg-3">
            <label class="form-label" for="gender">Gender</label>
            <select class="form-select" id="gender" name="gender">
                <option value="">All genders</option>
                <option th:each="option : ${genders}" th:value="${option}" th:selected="${option == gender}" th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(option.name(), '_', ' ')))}"></option>
            </select>
        </div>
        <div class="col-sm-6 col-lg-2">
            <label class="form-label" for="bloodGroup">Blood group</label>
            <select class="form-select" id="bloodGroup" name="bloodGroup">
                <option value="">All groups</option>
                <option th:each="option : ${bloodGroups}" th:value="${option}" th:selected="${option == bloodGroup}" th:text="${option}"></option>
            </select>
        </div>
        <div class="col-lg-3 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Search</button>
            <a class="btn btn-outline-secondary" th:href="@{/patients}">Clear</a>
        </div>
    </form>
    <p class="text-secondary small" th:text="|${records.totalElements} patient(s) found|"></p>
    <div th:if="${records.empty}" class="card border-0 shadow-sm text-center p-5">
        <h2 class="h5">No patients found</h2>
        <p class="text-secondary mb-3">Try another search, clear your filters, or register a patient.</p>
        <div><a class="btn btn-outline-primary" th:href="@{/patients/new}">Register patient</a></div>
    </div>
    <div th:unless="${records.empty}" class="card border-0 shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0 directory-table">
                <caption class="visually-hidden">Patient search results</caption>
                <thead><tr><th scope="col">Code</th><th scope="col">Name</th><th scope="col">Phone</th><th scope="col">Blood group</th><th scope="col">Actions</th></tr></thead>
                <tbody>
                    <tr th:each="record : ${records}">
                        <td class="text-nowrap small" th:text="${record.patientCode}"></td>
                        <td><a class="fw-semibold" th:href="@{/patients/{id}(id=${record.id})}" th:text="${record.fullName}"></a></td>
                            <td th:text="${record.phone}"></td>
                            <td th:text="${record.bloodGroup ?: 'Not known'}"></td>
                        <td class="text-nowrap">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/patients/{id}/edit(id=${record.id})}" th:attr="aria-label=|Edit ${record.fullName}|">Edit</a>
                            <a class="btn btn-sm btn-outline-danger" th:href="@{/patients/{id}/delete(id=${record.id})}" th:attr="aria-label=|Delete ${record.fullName}|">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <nav th:if="${records.totalPages > 0}" class="d-flex flex-wrap align-items-center justify-content-between gap-3 mt-4" aria-label="Patient directory pages">
        <span class="text-secondary small" th:text="|Page ${records.number + 1} of ${records.totalPages}|"></span>
        <div class="d-flex gap-2">
            <a th:if="${records.hasPrevious()}" class="btn btn-outline-secondary" th:href="@{/patients(keyword=${keyword},gender=${gender},bloodGroup=${bloodGroup},page=${records.number - 1})}">Previous</a>
            <a th:if="${records.hasNext()}" class="btn btn-outline-secondary" th:href="@{/patients(keyword=${keyword},gender=${gender},bloodGroup=${bloodGroup},page=${records.number + 1})}">Next</a>
        </div>
    </nav>
</main>
<footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
