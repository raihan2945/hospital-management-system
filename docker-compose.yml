services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_db}
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hospital_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      HOSPITAL_TIME_ZONE: ${HOSPITAL_TIME_ZONE:-Asia/Dhaka}
      DEMO_DATA: ${DEMO_DATA:-false}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hospital_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-hospital}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-hospital}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  hospital_postgres_data:
